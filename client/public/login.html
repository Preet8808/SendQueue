<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — SendQueue</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background: radial-gradient(circle at 50% 30%, #1e1b4b, #0b0f19 70%);">
  <div class="login-wrap">
    <div class="login-card">
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
        <div class="brand-icon">⚡</div>
        <div>
          <h1 class="brand-title" style="font-size: 1.35rem;">SendQueue</h1>
          <p style="font-size: 0.78rem; color: var(--text-secondary);">Enterprise Email Dispatch & Queue Engine</p>
        </div>
      </div>

      <div id="alertBox" class="alert-box"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Admin Email</label>
          <input type="email" id="email" class="form-control" placeholder="admin@sendqueue.local" required value="admin@sendqueue.local">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required value="admin123">
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 0.95rem; margin-top: 8px;">
          Sign In to Dashboard
        </button>
      </form>

      <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border-color); font-size: 0.78rem; color: var(--text-muted); text-align: center;">
        Default Seed Credentials: <code>admin@sendqueue.local</code> / <code>admin123</code>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.className = 'alert-box';
      alertBox.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Authenticating...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await API.login(email, password);
        alertBox.className = 'alert-box alert-success show';
        alertBox.textContent = 'Login successful! Redirecting...';
        setTimeout(() => {
          window.location.href = '/';
        }, 400);
      } catch (err) {
        alertBox.className = 'alert-box alert-danger show';
        alertBox.textContent = err.message || 'Invalid email or password';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In to Dashboard';
      }
    });
  </script>
</body>
</html>
