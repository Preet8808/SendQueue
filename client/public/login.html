<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In & Create Account — SendQueue</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="/js/theme.js"></script>
  <style>
    .password-input-wrap {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }
    .password-input-wrap .form-control {
      padding-right: 44px;
    }
    .password-toggle-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: var(--transition);
      user-select: none;
      line-height: 0;
    }
    .password-toggle-btn:hover {
      color: var(--text-primary);
      background: var(--bg-card-hover);
    }
    .password-toggle-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
        <div class="brand-icon">⚡</div>
        <div>
          <h1 class="brand-title" style="font-size: 1.35rem;">SendQueue</h1>
          <p style="font-size: 0.78rem; color: var(--text-secondary);">Simple & Reliable Email Sender</p>
        </div>
      </div>

      <!-- Auth Mode Switcher Tabs -->
      <div class="auth-tab-bar">
        <button type="button" class="auth-tab active" id="tabSignIn" onclick="setAuthMode('login')">
          Sign In
        </button>
        <button type="button" class="auth-tab" id="tabRegister" onclick="setAuthMode('register')">
          Create Account
        </button>
      </div>

      <div id="alertBox" class="alert-box"></div>

      <!-- 1. Sign In Form -->
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="name@company.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="password-input-wrap">
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="password-toggle-btn" onclick="togglePassword('loginPassword', this)" title="Show password" aria-label="Toggle password visibility">
              <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 0.95rem; margin-top: 8px;">
          Sign In
        </button>

        <div style="margin-top: 18px; text-align: center; font-size: 0.82rem; color: var(--text-secondary);">
          Don't have an account? <a href="javascript:void(0)" onclick="setAuthMode('register')" style="color: var(--primary); text-decoration: none; font-weight: 600;">Create one</a>
        </div>
      </form>

      <!-- 2. Create Account Form -->
      <form id="registerForm" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="regName">Full Name</label>
          <input type="text" id="regName" class="form-control" placeholder="Jane Doe" required autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Email Address</label>
          <input type="email" id="regEmail" class="form-control" placeholder="jane@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Password (at least 6 characters)</label>
          <div class="password-input-wrap">
            <input type="password" id="regPassword" class="form-control" placeholder="••••••••" minlength="6" required autocomplete="new-password">
            <button type="button" class="password-toggle-btn" onclick="togglePassword('regPassword', this)" title="Show password" aria-label="Toggle password visibility">
              <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regConfirmPassword">Confirm Password</label>
          <div class="password-input-wrap">
            <input type="password" id="regConfirmPassword" class="form-control" placeholder="••••••••" minlength="6" required autocomplete="new-password">
            <button type="button" class="password-toggle-btn" onclick="togglePassword('regConfirmPassword', this)" title="Show password" aria-label="Toggle password visibility">
              <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div style="font-size: 0.76rem; color: var(--text-muted); background: var(--bg-subtle); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: var(--radius-sm); margin-bottom: 16px;">
          ℹ️ New accounts are created as regular members.
        </div>

        <button type="submit" id="regSubmitBtn" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 0.95rem;">
          Create Account
        </button>

        <div style="margin-top: 18px; text-align: center; font-size: 0.82rem; color: var(--text-secondary);">
          Already have an account? <a href="javascript:void(0)" onclick="setAuthMode('login')" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign in</a>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const eyeOpenSvg = `
      <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    `;

    const eyeClosedSvg = `
      <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      </svg>
    `;

    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;

      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = eyeClosedSvg;
        btn.title = 'Hide password';
      } else {
        input.type = 'password';
        btn.innerHTML = eyeOpenSvg;
        btn.title = 'Show password';
      }
    }

    let currentMode = 'login';
    const alertBox = document.getElementById('alertBox');

    function setAuthMode(mode) {
      currentMode = mode;
      alertBox.className = 'alert-box';
      alertBox.textContent = '';

      const tabSignIn = document.getElementById('tabSignIn');
      const tabRegister = document.getElementById('tabRegister');
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');

      if (mode === 'login') {
        tabSignIn.classList.add('active');
        tabRegister.classList.remove('active');
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
      } else {
        tabRegister.classList.add('active');
        tabSignIn.classList.remove('active');
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
      }
    }

    // Sign In Handler
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.className = 'alert-box';
      alertBox.textContent = '';
      const submitBtn = document.getElementById('loginSubmitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      try {
        await API.login(email, password);
        alertBox.className = 'alert-box alert-success show';
        alertBox.textContent = 'Signed in! Opening dashboard...';
        setTimeout(() => {
          window.location.href = '/';
        }, 400);
      } catch (err) {
        alertBox.className = 'alert-box alert-danger show';
        alertBox.textContent = err.message || 'Invalid email or password';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });

    // Register / Create Account Handler with 2x Password Verification
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.className = 'alert-box';
      alertBox.textContent = '';
      const submitBtn = document.getElementById('regSubmitBtn');

      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;

      // Check passwords match
      if (password !== confirmPassword) {
        alertBox.className = 'alert-box alert-danger show';
        alertBox.textContent = 'Passwords do not match. Please check and try again.';
        document.getElementById('regConfirmPassword').focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        const res = await API.register(name, email, password);
        alertBox.className = 'alert-box alert-success show';
        alertBox.textContent = `Welcome, ${res.user?.name || name}! Your account is ready. Opening dashboard...`;
        setTimeout(() => {
          window.location.href = '/';
        }, 600);
      } catch (err) {
        alertBox.className = 'alert-box alert-danger show';
        alertBox.textContent = err.message || 'Failed to create account.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
